[global]
error_log = /var/www/storage/logs/php-fpm/php-fpm.log

[www]

pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500



access.log = /var/www/storage/logs/php-fpm/$pool.access.log
; Formato casado com App\Logs\FpmAccessLog (log-viewer): IP [data] "MÉTODO rota" status
; tempo(ms) memória(KB) cpu(%) script. Datetime no padrão HTTP Access (%d/%b/%Y:%H:%M:%S %z).
access.format = "%R [%{%d/%b/%Y:%H:%M:%S %z}t] \"%m %r%Q%q\" %s %{milli}d %{kilo}M %C %f"
